<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login | Uday Shinde</title>
    <meta name="robots" content="noindex, nofollow" />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/style.css" />
    <style>
      body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; }
      .login-card { width: 100%; max-width: 380px; padding: 2.5rem; }
      .login-card h1 { font-family: var(--font-display); font-size: 1.4rem; margin-bottom: .4rem; }
      .login-card p.sub { color: var(--text-muted); font-size: .85rem; margin-bottom: 1.75rem; }
      .login-card .form-group { margin-bottom: 1.1rem; }
      .login-card label { display: block; font-size: .82rem; color: var(--text-secondary); margin-bottom: .4rem; }
      .login-card input {
        width: 100%; padding: .75rem 1rem; border-radius: var(--radius-sm);
        border: 1px solid var(--glass-border); background: var(--bg-card); color: var(--text-primary);
        font-family: var(--font-body); font-size: .95rem;
      }
      .login-card input:focus { outline: none; border-color: var(--accent); }
      .login-error { color: var(--error); font-size: .82rem; min-height: 1.1rem; margin-bottom: .75rem; }
    </style>
  </head>
  <body>
    <form class="login-card glass-card" id="login-form" autocomplete="off">
      <h1>Admin Login</h1>
      <p class="sub">Private dashboard — Uday only.</p>
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" autocomplete="username" required />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required />
      </div>
      <div class="login-error" id="login-error"></div>
      <button type="submit" class="btn btn-primary btn-full" id="login-btn">
        <span>Log In</span>
        <span class="btn-loader" aria-hidden="true"></span>
      </button>
    </form>

    <script>
      const form = document.getElementById('login-form');
      const errorEl = document.getElementById('login-error');
      const btn = document.getElementById('login-btn');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorEl.textContent = '';
        btn.classList.add('loading');
        btn.disabled = true;
        try {
          const res = await fetch('/api/admin/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'same-origin',
            body: JSON.stringify({
              username: document.getElementById('username').value.trim(),
              password: document.getElementById('password').value,
            }),
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) {
            errorEl.textContent = data.error || 'Login failed.';
            return;
          }
          window.location.href = './';
        } catch (err) {
          errorEl.textContent = 'Network error — please try again.';
        } finally {
          btn.classList.remove('loading');
          btn.disabled = false;
        }
      });
    </script>
  </body>
</html>
